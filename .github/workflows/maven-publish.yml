name: Maven Package

on:
  push: 
    branches: [ "main" ]

jobs:
  build:
  
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build with Maven
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            mvn -B -Dsonar.skip=true package --file pom.xml
          else
            mvn -B -Dsonar.skip=true deploy --file pom.xml -s settings.xml
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
